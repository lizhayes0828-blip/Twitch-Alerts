<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Bat Top Center Alert Widget</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for cozy icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Quicksand & Fredoka for cozy cartoon aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        display: ['Fredoka', 'sans-serif'],
                    },
                    colors: {
                        cozy: {
                            bg: '#1a1412',
                            pill: '#f7ebd9',
                            pillBorder: '#e6ccb2',
                            textDark: '#5c4033',
                            accent: '#d4836b',
                            gold: '#e09f3e',
                            pink: '#e07a5f',
                        }
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'bounce-gentle': 'bounceGentle 2s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-4px)' },
                        },
                        bounceGentle: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f0d0c;
            color: #f7ebd9;
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
        }
        /* Custom smooth alert transitions */
        .alert-enter {
            opacity: 0;
            transform: translateY(-15px) scale(0.95);
        }
        .alert-enter-active {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .alert-exit {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .alert-exit-active {
            opacity: 0;
            transform: translateY(15px) scale(0.95);
            transition: all 0.3s ease-in;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-6">

    <!-- Top Debug / Preview Bar for the User -->
    <header class="w-full max-w-4xl bg-[#231c19] border border-[#4a352c] rounded-2xl p-4 shadow-xl flex flex-wrap items-center justify-between gap-4 z-50">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-[#e07a5f]/20 border border-[#e07a5f]/50 rounded-xl flex items-center justify-center text-[#e07a5f]">
                <i class="fa-solid fa-bell"></i>
            </div>
            <div>
                <h1 class="font-display font-bold text-base text-[#f7ebd9]">Top-Center Capsule Alert Widget</h1>
                <p class="text-xs text-[#b89f8c]">Tailored for your cozy bat attic overlay banner</p>
            </div>
        </div>
        
        <!-- Interactive Trigger Buttons -->
        <div class="flex flex-wrap items-center gap-2">
            <button onclick="triggerAlert('follow')" class="px-3 py-1.5 bg-[#e07a5f] hover:bg-[#cc6b50] text-[#1a1412] font-display text-xs font-bold rounded-xl shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-heart"></i> Test Follow
            </button>
            <button onclick="triggerAlert('sub')" class="px-3 py-1.5 bg-[#e09f3e] hover:bg-[#cb8b32] text-[#1a1412] font-display text-xs font-bold rounded-xl shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-star"></i> Test Sub
            </button>
            <button onclick="triggerAlert('tip')" class="px-3 py-1.5 bg-[#81b29a] hover:bg-[#6c9c84] text-[#1a1412] font-display text-xs font-bold rounded-xl shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-mug-hot"></i> Test Tip
            </button>
        </div>
    </header>

    <!-- OBS 1920x1080 Viewport Simulation / Placement Guide -->
    <main class="relative w-full max-w-[1200px] h-[550px] bg-[#151110] border-2 border-dashed border-[#4a352c] rounded-3xl overflow-hidden shadow-2xl flex items-start justify-center pt-8">
        
        <!-- Background Overlay Blueprint Preview (Simulating the Attic Top Header) -->
        <div class="absolute top-6 w-[700px] h-20 bg-[#2a221e] border-2 border-[#5c4033] rounded-3xl opacity-40 flex items-center justify-between px-8 pointer-events-none">
            <div class="w-8 h-8 rounded-full bg-[#3d3028]"></div>
            <div class="w-48 h-4 rounded-full bg-[#3d3028]"></div>
            <div class="w-8 h-8 rounded-full bg-[#3d3028]"></div>
        </div>

        <!-- ========================================== -->
        <!-- EXACT ALERT CAPSULE (Fit for Top Center)   -->
        <!-- ========================================== -->
        <div id="alertCapsule" class="relative z-10 w-[620px] h-[74px] bg-[#f7ebd9] border-[3px] border-[#e6ccb2] rounded-full shadow-[0_10px_30px_rgba(0,0,0,0.5)] flex items-center justify-between px-5 transition-all">
            
            <!-- Left Element: Mushroom Icon matching your overlay -->
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 bg-[#e07a5f]/15 border-2 border-[#e07a5f]/40 rounded-full flex items-center justify-center text-[#e07a5f] shadow-inner">
                    <i class="fa-solid fa-mushroom text-base animate-bounce-gentle"></i>
                </div>
                <!-- Cute Hanging Bat Silhouette -->
                <div class="text-[#5c4033] text-sm transform -rotate-6 animate-float">
                    <i class="fa-solid fa-bat"></i>
                </div>
            </div>

            <!-- Center Content: Dynamic Alert Text -->
            <div id="alertContent" class="flex-1 px-4 text-center overflow-hidden">
                <div class="flex items-center justify-center gap-2 font-display font-bold text-base text-[#5c4033] tracking-wide truncate">
                    <span id="alertUser" class="text-[#e07a5f]">MoonlitSprite</span> 
                    <span id="alertAction" class="font-semibold text-[#7c5e4c]">just followed the sanctuary!</span>
                    <span id="alertExtra" class="text-[#e09f3e]">🌸</span>
                </div>
            </div>

            <!-- Right Element: Sparkly Star / Diamond matching your overlay -->
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 bg-[#e09f3e]/15 border-2 border-[#e09f3e]/40 rounded-full flex items-center justify-center text-[#e09f3e] shadow-inner animate-pulse">
                    <i class="fa-solid fa-sparkles text-sm"></i>
                </div>
            </div>

        </div>

        <!-- Helpful OBS Integration Tip -->
        <div class="absolute bottom-6 bg-[#231c19]/90 border border-[#4a352c] px-6 py-3 rounded-2xl text-xs text-[#b89f8c] flex items-center gap-2 shadow-lg">
            <i class="fa-solid fa-circle-info text-[#e09f3e]"></i>
            <span><strong>OBS Browser Source Size:</strong> Set width to <strong>1920</strong> and height to <strong>150</strong>, positioned at top center.</span>
        </div>

    </main>

    <!-- Footer Instructions -->
    <footer class="text-xs text-[#8c7362] text-center">
        Cozy Bat Attic Stream Suite • Designed for OBS Studio & Streamlabs
    </footer>

    <!-- Alert Trigger Script -->
    <script>
        const alertQueue = [];
        let isDisplaying = false;

        const alertTypes = {
            follow: {
                user: "PipSqueak",
                action: "just followed the cozy sanctuary!",
                extra: "💕",
                icon: "fa-heart",
                iconColor: "text-[#e07a5f]",
                bgColor: "bg-[#e07a5f]/15 border-[#e07a5f]/40"
            },
            sub: {
                user: "StarryWings",
                action: "subscribed for 3 months (Tier 1)!",
                extra: "🦇✨",
                icon: "fa-star",
                iconColor: "text-[#e09f3e]",
                bgColor: "bg-[#e09f3e]/15 border-[#e09f3e]/40"
            },
            tip: {
                user: "HoneyPaws",
                action: "tipped 500 bits & sent warm cocoa!",
                extra: "☕🍯",
                icon: "fa-mug-hot",
                iconColor: "text-[#81b29a]",
                bgColor: "bg-[#81b29a]/15 border-[#81b29a]/40"
            }
        };

        function triggerAlert(type) {
            const data = alertTypes[type];
            if (!data) return;
            alertQueue.push(data);
            processQueue();
        }

        function processQueue() {
            if (isDisplaying || alertQueue.length === 0) return;
            isDisplaying = true;

            const current = alertQueue.shift();
            const capsule = document.getElementById('alertCapsule');
            const alertUser = document.getElementById('alertUser');
            const alertAction = document.getElementById('alertAction');
            const alertExtra = document.getElementById('alertExtra');

            // Fade out / slide up
            capsule.classList.add('alert-exit-active');

            setTimeout(() => {
                // Swap text content
                alertUser.textContent = current.user;
                alertAction.textContent = current.action;
                alertExtra.textContent = current.extra;

                // Animate in
                capsule.classList.remove('alert-exit-active');
                capsule.classList.add('alert-enter-active');

                // Play gentle chime sound effect using Web Audio API (no external files)
                playCozyChime();

                setTimeout(() => {
                    capsule.classList.remove('alert-enter-active');
                    isDisplaying = false;
                    processQueue(); // Process next alert if any
                }, 4000); // Display duration: 4 seconds

            }, 300);
        }

        // Web Audio API cozy chime generator
        function playCozyChime() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                
                const notes = [523.25, 659.25, 783.99]; // C5, E5, G5 chord
                notes.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    
                    gain.gain.setValueAtTime(0.05, ctx.currentTime + index * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + index * 0.08 + 1.2);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(ctx.currentTime + index * 0.08);
                    osc.stop(ctx.currentTime + index * 0.08 + 1.2);
                });
            } catch (e) {
                // Audio context not allowed before user interaction or unsupported
            }
        }

        // Auto trigger a welcome alert on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                triggerAlert('sub');
            }, 800);
        });
    </script>
</body>
</html>
